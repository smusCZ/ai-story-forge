name: Python API CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt pytest flake8

      - name: Check Python syntax and undefined names
        run: python -m flake8 apps/api --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run advisory lint
        run: python -m flake8 apps/api --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        env:
          PYTHONPATH: apps/api
        run: python -m pytest -q
